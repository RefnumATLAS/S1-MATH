function normalizeKeywords(input) {
    return input
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .split(/\s+/)
        .filter(Boolean);
}

function itemMatchesKeywords(desc, keywords) {
    if (!keywords.length) return true;
    const normalizedDesc = desc
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');

    return keywords.every(keyword => normalizedDesc.includes(keyword));
}

function renderApp() {
    const app = document.getElementById('app');
    const searchInput = document.getElementById('teacherSearch');
    const typeFilter = document.getElementById('typeFilter');
    if (!app || !searchInput || !typeFilter) return;

    app.innerHTML = '';

    const keywords = normalizeKeywords(searchInput.value);
    const selectedType = typeFilter.value;
    const filteredChampData = curriculumData
        .map(champ => {
            const modules = champ.modules
                .map(mod => ({
                    ...mod,
                    items: mod.items.filter(item => {
                        const matchesKeywords = itemMatchesKeywords(item.desc, keywords);
                        const matchesType = selectedType === 'all' || item.type === selectedType;
                        return matchesKeywords && matchesType;
                    })
                }))
                .filter(mod => mod.items.length > 0);

            return { ...champ, modules };
        })
        .filter(champ => champ.modules.length > 0);

    if (!filteredChampData.length) {
        app.innerHTML = '<div class="champ-card"><div class="champ-header collapsed" aria-expanded="false"><span class="champ-toggle">▾</span><span>Aucune compétence trouvée</span></div><div class="champ-content" style="display:none;"></div></div>';

        const searchText = searchInput.value.trim();
        if (searchText && selectedType !== 'all') {
            document.getElementById('searchInfo').textContent = `Aucune compétence ne correspond à : "${searchText}" et au type "${typeFilter.options[typeFilter.selectedIndex].text}".`;
        } else if (searchText) {
            document.getElementById('searchInfo').textContent = `Aucune compétence ne correspond à : "${searchText}".`;
        } else if (selectedType !== 'all') {
            document.getElementById('searchInfo').textContent = `Aucune compétence ne correspond au type "${typeFilter.options[typeFilter.selectedIndex].text}".`;
        } else {
            document.getElementById('searchInfo').textContent = 'Saisissez un ou plusieurs mots-clés pour filtrer les compétences.';
        }
        return;
    }

    const totalMatches = filteredChampData.reduce((count, champ) => count + champ.modules.reduce((sum, mod) => sum + mod.items.length, 0), 0);
    const searchText = searchInput.value.trim();
    if (searchText && selectedType !== 'all') {
        document.getElementById('searchInfo').textContent = `${totalMatches} compétence(s) correspondant à : "${searchText}" et au type "${typeFilter.options[typeFilter.selectedIndex].text}".`;
    } else if (searchText) {
        document.getElementById('searchInfo').textContent = `${totalMatches} compétence(s) correspondant à : "${searchText}".`;
    } else if (selectedType !== 'all') {
        document.getElementById('searchInfo').textContent = `${totalMatches} compétence(s) du type "${typeFilter.options[typeFilter.selectedIndex].text}".`;
    } else {
        document.getElementById('searchInfo').textContent = 'Saisissez un ou plusieurs mots-clés pour filtrer les compétences.';
    }

    filteredChampData.forEach((champ, cIdx) => {
        const champCard = document.createElement('div');
        champCard.className = 'champ-card';
        champCard.dataset.champIndex = cIdx;

        const collapsed = localStorage.getItem(`champ_collapsed_${cIdx}`) === 'true';

        let html = `
            <div class="champ-header ${collapsed ? 'collapsed' : ''}" data-champ-index="${cIdx}" role="button" tabindex="0" aria-expanded="${collapsed ? 'false' : 'true'}">
                <span class="champ-toggle">▾</span>
                <span>${champ.champ}</span>
            </div>
            <div class="champ-content" ${collapsed ? 'style="display:none;"' : ''}>
                <table>
                    <thead>
                        <tr>
                            <th style="width: 100px;">Type</th>
                            <th>Objectif d'apprentissage</th>
                            <th class="center" style="width: 60px;">P1</th>
                            <th class="center" style="width: 60px;">P2</th>
                            <th class="center" style="width: 60px;">P3</th>
                        </tr>
                    </thead>
                    <tbody>`;

        champ.modules.forEach((mod, mIdx) => {
            html += `<tr class="module-row"><td colspan="5">${mod.name}</td></tr>`;
            
            mod.items.forEach((item, iIdx) => {
                const idBase = `${cIdx}_${mIdx}_${iIdx}`;
                const badgeClass = item.type === 'S' ? 'badge-s' : (item.type === 'SF' ? 'badge-sf' : 'badge-c');
                const badgeLabel = item.type === 'S' ? 'Savoir' : (item.type === 'SF' ? 'Savoir-Faire' : 'Compétence');

                html += `<tr>
                            <td><span class="badge ${badgeClass}">${badgeLabel}</span></td>
                            <td>${item.desc}</td>
                            <td class="center"><input type="checkbox" id="${idBase}_p1" onchange="saveState('${idBase}_p1')"></td>
                            <td class="center"><input type="checkbox" id="${idBase}_p2" onchange="saveState('${idBase}_p2')"></td>
                            <td class="center"><input type="checkbox" id="${idBase}_p3" onchange="saveState('${idBase}_p3')"></td>
                         </tr>`;
            });
        });

        html += `</tbody></table>
            </div>`;
        champCard.innerHTML = html;

        const header = champCard.querySelector('.champ-header');
        header.addEventListener('click', () => toggleChamp(cIdx));
        header.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                toggleChamp(cIdx);
            }
        });

        app.appendChild(champCard);
    });

    loadState();
}

function toggleChamp(champIndex) {
    const champCard = document.querySelector(`.champ-card[data-champ-index="${champIndex}"]`);
    if (!champCard) return;

    const header = champCard.querySelector('.champ-header');
    const content = champCard.querySelector('.champ-content');
    const isCollapsed = header.classList.contains('collapsed');

    header.classList.toggle('collapsed', !isCollapsed);
    header.setAttribute('aria-expanded', String(isCollapsed));
    content.style.display = isCollapsed ? 'block' : 'none';
    localStorage.setItem(`champ_collapsed_${champIndex}`, String(!isCollapsed));
}

function saveState(id) {
    const el = document.getElementById(id);
    localStorage.setItem(id, el.checked);
    updateProgress();
}

// Nouvelle fonction de sauvegarde pour les métadonnées texte
function saveMetaValue(id) {
    const val = document.getElementById(id).value;
    localStorage.setItem(id, val);
}

function loadState() {
    // Restitution des cases à cocher
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    checkboxes.forEach(cb => {
        const val = localStorage.getItem(cb.id);
        if (val === 'true') cb.checked = true;
    });

    // Restitution des données textuelles globales
    const metaIds = ['meta_classe', 'meta_annee', 'meta_prof'];
    metaIds.forEach(id => {
        const stored = localStorage.getItem(id);
        if (stored) document.getElementById(id).value = stored;
    });

    updateProgress();
}

function updateProgress() {
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    let total = checkboxes.length;
    let checked = 0;
    
    checkboxes.forEach(cb => { if (cb.checked) checked++; });
    
    const pct = total > 0 ? Math.round((checked / total) * 100) : 0;
    document.getElementById('globalProgress').style.width = pct + '%';
    document.getElementById('progressText').innerText = pct + '% validé';
}

function resetData() {
    if (confirm("Êtes-vous sûr de vouloir réinitialiser toutes les données (cases et informations) ?")) {
        localStorage.clear();
        document.getElementById('meta_classe').value = '';
        document.getElementById('meta_annee').value = '';
        document.getElementById('meta_prof').value = '';
        renderApp();
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('teacherSearch');
    const typeFilter = document.getElementById('typeFilter');
    const clearSearchBtn = document.getElementById('clearSearchBtn');

    if (searchInput) {
        searchInput.addEventListener('input', renderApp);
    }
    if (typeFilter) {
        typeFilter.addEventListener('change', renderApp);
    }
    if (clearSearchBtn) {
        clearSearchBtn.addEventListener('click', () => {
            if (searchInput) searchInput.value = '';
            if (typeFilter) typeFilter.value = 'all';
            renderApp();
        });
    }
    renderApp();
});
